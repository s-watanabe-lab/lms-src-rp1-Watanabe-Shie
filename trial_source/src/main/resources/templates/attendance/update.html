<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{/common/layout :: layout(~{::title},~{::body/content()})}">

<head>
	<meta charset="UTF-8">
	<title>勤怠情報変更｜LMS</title>
</head>

<body>

	<style>
		.error-select {
			background-color: #ffcccc !important;
			border: 1px solid red !important;
		}
	</style>

	<th:block th:if="${session.loginUserDto.role == '0001'}">
		<h2>勤怠管理</h2>
	</th:block>

	<th:block th:if="${session.loginUserDto.role != '0001'}">
		<h2>勤怠管理 <small>( [[${attendanceForm.userName}]] )</small></h2>
		<th:block th:if="${session.loginUserDto.leaveFlg == '1'}">
			<h2><small>途中退校日：${dispLeaveDate}</small></h2>
		</th:block>
	</th:block>

	<div class="row">
		<div class="bs-component col-sm-12">

			<form th:action="@{/attendance/update}" method="post">


				<th:block th:if="${#fields.hasErrors('attendanceForm.*')}">
					<ul style="padding-left: 0; list-style: none;">
						<li th:each="err : ${#fields.errors('attendanceForm.*')}">
							<span th:text="'*' + '&nbsp;' + ${err}" class="help-inline error"></span>
						</li>
					</ul>
				</th:block>

				<!--				 Task.29 勤怠管理直接変更画面 一覧のスクロール表示 -->
				<!--				 表を囲むスクロール用の箱（高さは約500pxに設定 -->
				<!--				<div style="max-height: 500px; overflow: auto;">-->


				<table class="table table-hover dataTable no-footer">
					<thead>

						<tr>
							<th class="w140">日付</th>
							<th class="w300">コース内容</th>

							<!-- Task.28 勤怠管理直接変更画面 -->
							<!-- 定時ボタン用のスペース -->
							<th class="w60"></th>

							<th class="w70">出勤</th>
							<th class="w70">退勤</th>
							<th class="w100">中抜け時間</th>
							<th class="w100">ステータス</th>
							<th class="w240">備考</th>
						</tr>

					</thead>
					<tbody>
						<th:block th:each="dailyAttendanceForm, stat : *{attendanceForm.attendanceList}">
							<tr>
								<th:block>
									<input type="hidden" th:name="|attendanceList[${stat.index}].isToday|"
										th:value="${dailyAttendanceForm.isToday}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].studentAttendanceId|"
										th:value="${dailyAttendanceForm.studentAttendanceId}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].trainingDate|"
										th:value="${dailyAttendanceForm.trainingDate}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].dispTrainingDate|"
										th:value="${dailyAttendanceForm.dispTrainingDate}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].sectionName|"
										th:value="${dailyAttendanceForm.sectionName}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].statusDispName|"
										th:value="${dailyAttendanceForm.statusDispName}" />
								</th:block>
								<td class="w140">[[${dailyAttendanceForm.dispTrainingDate}]]</td>


								<td class="w300">[[${dailyAttendanceForm.sectionName}]]</td>

								<!-- Task.28 勤怠管理直接変更画面 -->
								<!-- 定時ボタンの追加 -->
								<td class="w60">
									<button type="button" class="btn btn-success btn-sm js-teiji-btn">定時</button>
								</td>



								<!-- Task.26 -->
								<!-- 出勤時間（プルダウン化） -->
								<td class="w140">

									<!-- Task.26 ①時 -->
									<!-- Task.27 セレクトボックスを赤色で表示-->
									<select th:name="|attendanceList[${stat.index}].trainingStartTimeHour|"
										th:classappend="${#fields.hasErrors('attendanceForm.attendanceList[__${stat.index}__].trainingStartTime') and (dailyAttendanceForm.trainingStartTimeHour == null or dailyAttendanceForm.trainingStartTimeMinute != null)} ? 'error-select' : ''">
										<option th:each="hour : ${attendanceForm.hourMap}" th:value="${hour.key}"
											th:text="${hour.value}"
											th:selected="${hour.key == dailyAttendanceForm.trainingStartTimeHour}">
										</option>
									</select>：

									<!-- Task.26 ②分 -->
									<!-- Task.27 セレクトボックスを赤色で表示-->
									<select th:name="|attendanceList[${stat.index}].trainingStartTimeMinute|"
										th:classappend="${#fields.hasErrors('attendanceForm.attendanceList[__${stat.index}__].trainingStartTime') and (dailyAttendanceForm.trainingStartTimeMinute == null or dailyAttendanceForm.trainingStartTimeHour != null)} ? 'error-select' : ''">
										<option th:each="minute : ${attendanceForm.minuteMap}" th:value="${minute.key}"
											th:text="${minute.value}"
											th:selected="${minute.key == dailyAttendanceForm.trainingStartTimeMinute}">
										</option>
									</select>
								</td>

								<!-- 退勤時間（プルダウン化） -->

								<td class="w140">

									<!-- Task.26 ①時 -->
									<!-- Task.27 セレクトボックスを赤色で表示-->
									<select th:name="|attendanceList[${stat.index}].trainingEndTimeHour|"
										th:classappend="${#fields.hasErrors('attendanceForm.attendanceList[__${stat.index}__].trainingEndTime') and (dailyAttendanceForm.trainingEndTimeHour == null or dailyAttendanceForm.trainingEndTimeMinute != null)} ? 'error-select' : ''">
										<option th:each="hour : ${attendanceForm.hourMap}" th:value="${hour.key}"
											th:text="${hour.value}"
											th:selected="${hour.key == dailyAttendanceForm.trainingEndTimeHour}">
										</option>
									</select>：

									<!-- Task.26 ②分 -->
									<!-- Task.27 セレクトボックスを赤色で表示-->
									<select th:name="|attendanceList[${stat.index}].trainingEndTimeMinute|"
										th:classappend="${#fields.hasErrors('attendanceForm.attendanceList[__${stat.index}__].trainingEndTime') and (dailyAttendanceForm.trainingEndTimeMinute == null or dailyAttendanceForm.trainingEndTimeHour != null)} ? 'error-select' : ''">
										<option th:each="minute : ${attendanceForm.minuteMap}" th:value="${minute.key}"
											th:text="${minute.value}"
											th:selected="${minute.key == dailyAttendanceForm.trainingEndTimeMinute}">
										</option>
									</select>

								</td>

								<td class="w80">
									<select th:name="|attendanceList[${stat.index}].blankTime|" class="form-control"
										th:classappend="${#fields.hasErrors('attendanceForm.attendanceList[__${stat.index}__].blankTime')} ? 'error-select' : ''">
										<option th:each="blankTime : ${attendanceForm.blankTimes}"
											th:value="${blankTime.key}" th:inline="text" class="form-control"
											th:selected="${blankTime.key == dailyAttendanceForm.blankTime}">
											[[${blankTime.value}]]
										</option>
									</select>
								</td>
								<td class="w70">[[${dailyAttendanceForm.statusDispName}]]</td>
								<td class="w240">
									<input type="text" th:name="|attendanceList[${stat.index}].note|"
										th:value="${dailyAttendanceForm.note}" class="form-control"
										th:classappend="${#fields.hasErrors('attendanceForm.attendanceList[__${stat.index}__].note')} ? 'error-select' : ''"></input>
								</td>
							</tr>
						</th:block>
					</tbody>
				</table>
				<!--				</div>-->

				<div class="form-group">
					<th:block th:if="${session.loginUserDto.role == '0001'}">
						<a th:href="@{/attendance/detail}" class="btn btn-default">戻る</a>
					</th:block>
					<th:block th:if="${session.loginUserDto.role != '0001'}">
						<input type="submit" value="戻る" name="indexCompany" class="btn btn-default" />
					</th:block>
					<input type="submit" value="更新" name="complete" id="updateBtn" class="btn btn-info" />
				</div>

			</form>
		</div>
	</div>

	<!-- Task.27 更新確認ダイアログ表示 -->
	<script>
		document.getElementById('updateBtn').addEventListener('click', function (event) {
			// 確認ダイアログを表示
			if (!confirm('更新します。よろしいですか？')) {
				// 「キャンセル」が押されたら送信をストップする
				event.preventDefault();
			}
		});

		//Tasl.28 勤怠管理直接変更画面：定時ボタン追加
		const teijiBtns = document.querySelectorAll('.js-teiji-btn');

		teijiBtns.forEach(function (btn) {
			btn.addEventListener('click', function () {
				// クリックされたボタンの親の「行（tr）」を見つける
				const row = this.closest('tr');

				// その行の中にある出退勤のセレクトボックスを探す
				// （name属性の末尾の文字をヒントに探します）
				const startHour = row.querySelector('select[name$=".trainingStartTimeHour"]');
				const startMinute = row.querySelector('select[name$=".trainingStartTimeMinute"]');
				const endHour = row.querySelector('select[name$=".trainingEndTimeHour"]');
				const endMinute = row.querySelector('select[name$=".trainingEndTimeMinute"]');

				// セレクトボックスに値をセットする（09:00 ～ 18:00）
				if (startHour) startHour.value = "9";
				if (startMinute) startMinute.value = "0";
				if (endHour) endHour.value = "18";
				if (endMinute) endMinute.value = "0";
			});
		});

	</script>
</body>

</html>
